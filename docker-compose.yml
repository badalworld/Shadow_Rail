# Production-ish stack for a single host:
#   SHADOW_RAIL_API_TOKEN=$(openssl rand -hex 32) docker compose up -d --build
#
#   • the dashboard + API listen on 127.0.0.1 only — put a TLS reverse proxy
#     (or an SSH tunnel) in front if you need remote access;
#   • the journal, encrypted config and Fernet key persist in the named volume;
#   • the container is single-replica by design: the engine keeps trading state
#     in-process and SQLite has one writer.
services:
  shadow-rail:
    build: .
    image: shadow-rail:latest
    container_name: shadow-rail
    restart: unless-stopped
    ports:
      - "${SHADOW_RAIL_BIND:-127.0.0.1}:8080:8080"
    environment:
      # required: without it the API answers anyone who can reach the port
      SHADOW_RAIL_API_TOKEN: "${SHADOW_RAIL_API_TOKEN:?set SHADOW_RAIL_API_TOKEN (openssl rand -hex 32)}"
      SHADOW_RAIL_LOG_LEVEL: "${SHADOW_RAIL_LOG_LEVEL:-info}"
    volumes:
      - shadow-rail-data:/data
    stop_grace_period: 45s          # lets the engine flatten/snapshot on shutdown
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  shadow-rail-data:

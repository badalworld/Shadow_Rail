name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt

      - name: Static checks (pyflakes + repo audit)
        run: |
          python -m pyflakes backend/app backend/tests scripts
          python scripts/audit.py --strict

      - name: Backend test-suite
        run: python -m pytest -q
        working-directory: backend

      - name: Frontend deps + type-check + build
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
        working-directory: frontend

      - name: Start the engine (simulator transport)
        working-directory: backend
        run: |
          nohup python -m app.main > /tmp/shadow-rail.log 2>&1 &
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "engine did not come up"; cat /tmp/shadow-rail.log; exit 1

      - name: Dashboard checks against the live API
        working-directory: frontend
        run: |
          node scripts/ui-spec-check.mjs http://127.0.0.1:8080
          node scripts/hq-audit.mjs http://127.0.0.1:8080
          SMOKE_API=http://127.0.0.1:8080 node scripts/ssr-smoke.mjs capture
          node scripts/ssr-smoke.mjs

      - name: Engine log (on failure)
        if: failure()
        run: tail -200 /tmp/shadow-rail.log || true
